# CIRR Dataset Configuration for Iterative Training

CIRR:
    dataset_parser: IterativeCIRRDataset
    dataset_name: CIRR
    dataset_split: train
    data_dir: /path/to/CIRR/cirr
    image_base_dir: /path/to/CIRR
    captions_file: /path/to/CIRR/cirr/captions/cap.rc2.train.json
    image_splits_file: /path/to/CIRR/cirr/image_splits/split.rc2.train.json
    num_sample_per_subset: -1
    weight: 1.0
    
    # Iterative training configs
    max_iterations: 2
    hard_neg_collection_freq: 1
    hard_neg_top_k: 10
    hard_neg_post_gt: 0
    hard_neg_per_query: 5
    caption_generation_batch_size: 16
    
    # Production mode settings
    # Each iteration resets optimizer/scheduler for independent LR schedule
    fast_mode: false
    steps_per_iteration: 5000
    production_save_steps: 500
    production_eval_steps: 1000
    production_logging_steps: 50
    
    # Fast mode settings (uncomment for debugging)
    # fast_mode: true
    # fast_mode_max_samples: 200
    # fast_mode_retrieval_db_size: 100
    # fast_mode_max_steps: 20
    # fast_mode_save_steps: 10
    # fast_mode_eval_steps: 15
    # fast_mode_logging_steps: 2
    
    # Foundation model for caption generation
    foundation_model_name: /path/to/Qwen2.5-VL-7B-Instruct
    foundation_model_temperature: 0.8
    foundation_model_max_length: 2048
