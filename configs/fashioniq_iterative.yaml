# FashionIQ Dataset Configuration for Iterative Training

FashionIQ:
    dataset_parser: IterativeFashionIQDataset
    dataset_name: FashionIQ
    dataset_split: train
    data_dir: /path/to/FashionIQ
    image_base_dir: /path/to/FashionIQ
    num_sample_per_subset: -1
    weight: 1.0
    
    # Iterative training configs
    max_iterations: 2
    hard_neg_collection_freq: 1
    hard_neg_top_k: 1
    caption_generation_batch_size: 32
    
    # Production mode settings
    fast_mode: false
    steps_per_iteration: 100
    production_save_steps: 50
    production_eval_steps: 1000
    production_logging_steps: 50
    
    # Fast mode settings (uncomment for debugging)
    # fast_mode: true
    # fast_mode_max_samples: 200
    # fast_mode_retrieval_db_size: 100
    # fast_mode_max_steps: 20
    # fast_mode_save_steps: 10
    # fast_mode_eval_steps: 15
    # fast_mode_logging_steps: 2

    # Foundation model for caption generation (optional)
    # foundation_model_name: /path/to/Qwen2.5-VL-7B-Instruct
    # foundation_model_temperature: 0.7
    # foundation_model_max_length: 128
