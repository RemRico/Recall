# FashionIQ Evaluation Configuration

FashionIQ:
  data_dir: /path/to/FashionIQ
  image_base_dir: /path/to/FashionIQ/images
  categories: [dress, shirt, toptee]
  validation:
    queries_files:
      dress: captions/cap.dress.val.json
      shirt: captions/cap.shirt.val.json
      toptee: captions/cap.toptee.val.json
  evaluation:
    batch_size: 16
    recall_k: [1, 5, 10, 50]

model:
  default_backbone: qwen2_vl
  max_length: 512
